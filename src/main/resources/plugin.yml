name: TagPlugin
version: '2.0.0'
main: com.server.tagplugin.TagPlugin
api-version: '26.2'
author: Server Admin
description: Oyuncu isimlerine önek (prefix) ve sonek (suffix) tag ekler (chat + tab liste), OP tarafından yönetilir.

commands:
  tag:
    description: Tag yönetim komutu
    usage: /tag <set|setsuffix|remove|removesuffix|setek|removeek|setlig|removelig|list|create|deletetag|info|cleanup> [args]
    permission: tagplugin.admin
    permission-message: '&cBu komutu kullanmak için yetkin yok.'

permissions:
  tagplugin.admin:
    description: Tag ekleme/kaldırma/oluşturma yetkisi
    default: op